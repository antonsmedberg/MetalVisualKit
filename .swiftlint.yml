# MetalVisualKit SwiftLint configuration
#
# Keep this deliberately focused:
# - swift-format owns formatting
# - SwiftLint catches correctness, maintainability and structural issues
# - GPU-oriented Swift may legitimately use short vector/matrix identifiers

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - Examples
  - .swiftpm

disabled_rules:
  # TODOs are tracked deliberately in this repository.
  - todo

  # Short vector/matrix names such as x, y, uv and dt are idiomatic
  # in Metal and graphics code.
  - identifier_name

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - superfluous_disable_command
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

# MARK: - Formatting compatibility

# Must match:
#   .swift-format -> indentSwitchCaseLabels: false
#   Xcode          -> do not indent Swift case labels
switch_case_alignment:
  severity: warning
  indented_cases: false
  ignore_one_liners: false

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# MARK: - Maintainability

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 5
  error: 7

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 10
  error: 20

# Better integration with Xcode's issue navigator.
reporter: xcode
