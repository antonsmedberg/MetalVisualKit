# MetalVisualKit SwiftLint configuration
#
# swift-format owns formatting.
# SwiftLint owns correctness, maintainability and structural checks.

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - Examples
  - .swiftpm

disabled_rules:
  # TODOs are intentionally tracked in this repository.
  - todo

  # Short GPU identifiers such as x, y, uv and dt are idiomatic.
  - identifier_name

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - superfluous_disable_command
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

switch_case_alignment:
  severity: warning
  indented_cases: false
  ignore_one_liners: false

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 5
  error: 7

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 10
  error: 20

reporter: xcode
