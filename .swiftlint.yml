# MetalVisualKit SwiftLint configuration
#
# Formatting is owned by swift-format.
# SwiftLint focuses on correctness, maintainability and structural quality.
#
# This distinction is intentional. Rules that duplicate or conflict with
# swift-format should not be enabled here.

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - .swiftpm
  - Examples

disabled_rules:
  # TODOs are deliberately tracked in this repository.
  - todo

  # Short GPU-oriented identifiers such as x, y, uv, dt and p0 are idiomatic
  # in graphics, SIMD and Metal code.
  - identifier_name

  # swift-format owns brace placement.
  #
  # In multiline declarations and control-flow statements swift-format may
  # place the opening brace on the following line. SwiftLint's opening_brace
  # rule can disagree with that canonical formatting.
  - opening_brace

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - superfluous_disable_command
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

# MARK: - Layout boundaries

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# MARK: - Maintainability

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 5
  error: 7

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 10
  error: 20

# MARK: - Switch layout

# Keep this aligned with:
#
#   .swift-format:
#       indentSwitchCaseLabels = false
#
# This remains useful because it catches accidental manual indentation while
# not overlapping with brace placement.
switch_case_alignment:
  severity: warning
  indented_cases: false
  ignore_one_liners: false

# MARK: - Output

reporter: xcode
