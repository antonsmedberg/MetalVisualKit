# Generate the Xcode project with:  xcodegen generate
# (brew install xcodegen)
#
# The project is generated rather than committed so the repo has no 30,000-line
# project.pbxproj in its diff history.

name: MetalVisualKitDemo

options:
  bundleIdPrefix: eu.smedberg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MetalVisualKit:
    path: ../..

targets:
  MetalVisualKitDemo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: MetalVisualKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Metal Visual Kit
        UILaunchScreen: {}
        # All orientations on purpose: the renderer selects a depth-to-camera
        # rotation per interface orientation, and a portrait-locked demo makes
        # that code impossible to test.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          Used to visualize depth data from the LiDAR scanner.
    settings:
      base:
        # iPhone and iPad — iPad Pro is a LiDAR target too.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
