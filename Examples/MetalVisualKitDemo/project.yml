# Regenerate the committed Xcode project with `make project` from the repository
# root after changing this file. The shared demo scheme is intentional: without
# it Xcode can select SwiftPM's library scheme, which does not build demo files.

name: MetalVisualKitDemo

options:
  bundleIdPrefix: eu.smedberg
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MetalVisualKit:
    path: ../..

targets:
  MetalVisualKitDemo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: MetalVisualKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Metal Visual Kit
        UILaunchScreen: {}
        # All orientations on purpose: the renderer selects a depth-to-camera
        # rotation per interface orientation, and a portrait-locked demo makes
        # that code impossible to test.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          Used to visualize depth data from the LiDAR scanner.
    settings:
      base:
        # iPhone and iPad — iPad Pro is a LiDAR target too.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  MetalVisualKitDemo:
    build:
      targets:
        MetalVisualKitDemo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
